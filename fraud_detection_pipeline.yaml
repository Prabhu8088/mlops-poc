# PIPELINE DEFINITION
# Name: fraud-detection-pipeline
# Description: Fraud detection MLOps pipeline
components:
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model_file:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-generate-data:
    executorLabel: exec-generate-data
    outputDefinitions:
      artifacts:
        output_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-data:
    executorLabel: exec-preprocess-data
    inputDefinitions:
      artifacts:
        input_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        test_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        test_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_file:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        model_file:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model_file: dsl.Input[dsl.Model],\n    test_file:\
          \ dsl.Input[dsl.Dataset],\n):\n    import pandas as pd\n    import joblib\n\
          \n    from sklearn.metrics import (\n        accuracy_score,\n        precision_score,\n\
          \        recall_score,\n        f1_score,\n    )\n\n    model = joblib.load(model_file.path)\n\
          \n    test_data = pd.read_csv(test_file.path)\n\n    X_test = test_data.drop(\"\
          fraud\", axis=1)\n    y_test = test_data[\"fraud\"]\n\n    y_pred = model.predict(X_test)\n\
          \n    accuracy = accuracy_score(y_test, y_pred)\n    precision = precision_score(y_test,\
          \ y_pred)\n    recall = recall_score(y_test, y_pred)\n    f1 = f1_score(y_test,\
          \ y_pred)\n\n    print(\"\\nModel Evaluation\")\n    print(\"----------------\"\
          )\n    print(f\"Accuracy : {accuracy:.4f}\")\n    print(f\"Precision: {precision:.4f}\"\
          )\n    print(f\"Recall   : {recall:.4f}\")\n    print(f\"F1 Score : {f1:.4f}\"\
          )\n\n"
        image: python:3.12-slim
    exec-generate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy' 'pandas'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_data(\n    output_file: dsl.Output[dsl.Dataset],\n):\n\
          \    import numpy as np\n    import pandas as pd\n\n    np.random.seed(42)\n\
          \n    NUM_RECORDS = 10000\n\n    data = pd.DataFrame({\n        \"transaction_amount\"\
          : np.random.exponential(200, NUM_RECORDS),\n        \"transaction_hour\"\
          : np.random.randint(0, 24, NUM_RECORDS),\n        \"customer_age\": np.random.randint(18,\
          \ 80, NUM_RECORDS),\n        \"account_age_days\": np.random.randint(30,\
          \ 3000, NUM_RECORDS),\n        \"transactions_last_24h\": np.random.poisson(3,\
          \ NUM_RECORDS),\n        \"foreign_transaction\": np.random.randint(0, 2,\
          \ NUM_RECORDS),\n        \"distance_from_home\": np.random.exponential(20,\
          \ NUM_RECORDS),\n        \"previous_fraud_count\": np.random.poisson(0.2,\
          \ NUM_RECORDS),\n    })\n\n    fraud_score = (\n        (data[\"transaction_amount\"\
          ] > 500) * 1.5\n        + (data[\"transaction_hour\"].isin([0, 1, 2, 3,\
          \ 4])) * 1.0\n        + (data[\"transactions_last_24h\"] > 8) * 1.2\n  \
          \      + (data[\"foreign_transaction\"] == 1) * 1.0\n        + (data[\"\
          distance_from_home\"] > 50) * 1.3\n        + (data[\"previous_fraud_count\"\
          ] > 0) * 1.5\n    )\n\n    probability = 1 / (1 + np.exp(-(fraud_score -\
          \ 2.5)))\n\n    data[\"fraud\"] = np.random.binomial(1, probability)\n\n\
          \    data.to_csv(output_file.path, index=False)\n\n    print(f\"Generated\
          \ {len(data)} records\")\n    print(f\"Saved dataset to: {output_file.path}\"\
          )\n\n    print(\"\\nClass distribution:\")\n    print(data[\"fraud\"].value_counts())\n\
          \n"
        image: python:3.12-slim
    exec-preprocess-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_data(\n    input_file: dsl.Input[dsl.Dataset],\n \
          \   train_file: dsl.Output[dsl.Dataset],\n    test_file: dsl.Output[dsl.Dataset],\n\
          ):\n    import pandas as pd\n    from sklearn.model_selection import train_test_split\n\
          \n    data = pd.read_csv(input_file.path)\n\n    train_data, test_data =\
          \ train_test_split(\n        data,\n        test_size=0.2,\n        random_state=42,\n\
          \        stratify=data[\"fraud\"],\n    )\n\n    train_data.to_csv(train_file.path,\
          \ index=False)\n    test_data.to_csv(test_file.path, index=False)\n\n  \
          \  print(f\"Training records: {len(train_data)}\")\n    print(f\"Testing\
          \ records: {len(test_data)}\")\n\n"
        image: python:3.12-slim
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'joblib' 'mlflow'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    train_file: dsl.Input[dsl.Dataset],\n    test_file:\
          \ dsl.Input[dsl.Dataset],\n    model_file: dsl.Output[dsl.Model],\n):\n\
          \    import os\n    import tempfile\n    import joblib\n    import pandas\
          \ as pd\n    import mlflow\n    import mlflow.sklearn\n\n    from sklearn.ensemble\
          \ import RandomForestClassifier\n    from sklearn.linear_model import LogisticRegression\n\
          \    from sklearn.metrics import (\n        accuracy_score,\n        precision_score,\n\
          \        recall_score,\n        f1_score,\n    )\n\n    # MLflow server\
          \ running on EC2\n    mlflow.set_tracking_uri(\"http://172.31.15.216:5000\"\
          )\n    mlflow.set_experiment(\"fraud-detection\")\n\n    # Load training\
          \ data\n    train_data = pd.read_csv(train_file.path)\n    X_train = train_data.drop(\"\
          fraud\", axis=1)\n    y_train = train_data[\"fraud\"]\n\n    # Load test\
          \ data\n    test_data = pd.read_csv(test_file.path)\n    X_test = test_data.drop(\"\
          fraud\", axis=1)\n    y_test = test_data[\"fraud\"]\n\n    # Algorithms\
          \ to compare\n    models = {\n        \"random_forest\": RandomForestClassifier(\n\
          \            n_estimators=100,\n            max_depth=10,\n            random_state=42,\n\
          \            class_weight=\"balanced\",\n        ),\n        \"logistic_regression\"\
          : LogisticRegression(\n            max_iter=1000,\n            class_weight=\"\
          balanced\",\n            random_state=42,\n        ),\n    }\n\n    results\
          \ = []\n    os.makedirs(os.path.dirname(model_file.path) or \".\", exist_ok=True)\n\
          \n\n    # Train and log each algorithm as a separate MLflow run\n    with\
          \ tempfile.TemporaryDirectory() as temp_dir:\n        for algorithm, model\
          \ in models.items():\n            with mlflow.start_run(run_name=algorithm):\n\
          \                mlflow.log_param(\"algorithm\", algorithm)\n          \
          \      mlflow.log_param(\"class_weight\", \"balanced\")\n              \
          \  mlflow.log_param(\"random_state\", 42)\n\n                if algorithm\
          \ == \"random_forest\":\n                    mlflow.log_param(\"n_estimators\"\
          , 100)\n                    mlflow.log_param(\"max_depth\", 10)\n      \
          \          else:\n                    mlflow.log_param(\"max_iter\", 1000)\n\
          \n                model.fit(X_train, y_train)\n                y_pred =\
          \ model.predict(X_test)\n\n                metrics = {\n               \
          \     \"accuracy\": accuracy_score(y_test, y_pred),\n                  \
          \  \"precision\": precision_score(\n                        y_test, y_pred,\
          \ zero_division=0\n                    ),\n                    \"recall\"\
          : recall_score(\n                        y_test, y_pred, zero_division=0\n\
          \                    ),\n                    \"f1_score\": f1_score(\n \
          \                       y_test, y_pred, zero_division=0\n              \
          \      ),\n                }\n\n                mlflow.log_metrics(metrics)\n\
          \n                # Log a native MLflow model for registry compatibility\n\
          \                mlflow.sklearn.log_model(\n                    model,\n\
          \                    artifact_path=\"mlflow-model\",\n                 \
          \   skops_trusted_types=[\"sklearn.tree._tree.Tree\"],\n               \
          \ )\n\n                run_id = mlflow.active_run().info.run_id\n\n    \
          \            results.append({\n                    \"algorithm\": algorithm,\n\
          \                    \"f1_score\": metrics[\"f1_score\"],\n            \
          \        \"run_id\": run_id,\n                    \"metrics\": metrics,\n\
          \                })\n\n                print(f\"\\nAlgorithm: {algorithm}\"\
          )\n                print(f\"MLflow Run ID: {run_id}\")\n               \
          \ for metric_name, value in metrics.items():\n                    print(f\"\
          {metric_name}: {value:.4f}\")\n\n        # Both algorithms have now completed.\
          \ Select the winner.\n        best_result = max(results, key=lambda result:\
          \ result[\"f1_score\"])\n\n        # Register only the winning model\n \
          \       model_uri = f\"runs:/{best_result['run_id']}/mlflow-model\"\n  \
          \      registered_model_name = \"fraud-detection-model\"\n\n        registered_model\
          \ = mlflow.register_model(\n            model_uri=model_uri,\n         \
          \   name=registered_model_name,\n        )\n\n        print(\"\\n==========\
          \ Model Registry ==========\")\n        print(f\"Registered model: {registered_model_name}\"\
          )\n        print(f\"Model version: {registered_model.version}\")\n     \
          \   print(f\"Selected algorithm: {best_result['algorithm']}\")\n       \
          \ print(f\"Selected run ID: {best_result['run_id']}\")\n\n        # Preserve\
          \ the existing Kubeflow output artifact\n        joblib.dump(models[best_result[\"\
          algorithm\"]], model_file.path)\n\n        print(\"\\n========== Model Comparison\
          \ ==========\")\n        for result in results:\n            print(\n  \
          \              f\"{result['algorithm']}: \"\n                f\"F1={result['f1_score']:.4f}\"\
          \n            )\n\n        print(f\"\\nBest algorithm: {best_result['algorithm']}\"\
          )\n        print(f\"Best F1 score: {best_result['f1_score']:.4f}\")\n  \
          \      print(f\"Selected model saved to: {model_file.path}\")\n\n"
        image: python:3.12-slim
pipelineInfo:
  description: Fraud detection MLOps pipeline
  name: fraud-detection-pipeline
root:
  dag:
    tasks:
      evaluate-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - preprocess-data
        - train-model
        inputs:
          artifacts:
            model_file:
              taskOutputArtifact:
                outputArtifactKey: model_file
                producerTask: train-model
            test_file:
              taskOutputArtifact:
                outputArtifactKey: test_file
                producerTask: preprocess-data
        taskInfo:
          name: evaluate-model
      generate-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-generate-data
        taskInfo:
          name: generate-data
      preprocess-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-data
        dependentTasks:
        - generate-data
        inputs:
          artifacts:
            input_file:
              taskOutputArtifact:
                outputArtifactKey: output_file
                producerTask: generate-data
        taskInfo:
          name: preprocess-data
      train-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            test_file:
              taskOutputArtifact:
                outputArtifactKey: test_file
                producerTask: preprocess-data
            train_file:
              taskOutputArtifact:
                outputArtifactKey: train_file
                producerTask: preprocess-data
        taskInfo:
          name: train-model
schemaVersion: 2.1.0
sdkVersion: kfp-2.17.0
