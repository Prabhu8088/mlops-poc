name: MLOPS Pipeline

on:
    push:
        branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token

    # MLOps pipeline image
    - name: Build Docker image
      run: |
          docker build \
            -t mlops-poc:${{ github.run_number }} .
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Create ECR pull secret
      run: |
        kubectl create secret docker-registry ecr-secret \
        --namespace churn-model \
        --docker-server=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com \
        --docker-username=AWS \
        --docker-password="$(aws ecr get-login-password --region us-east-1)" \
        --dry-run=client \
        -o yaml | kubectl apply -f -

    - name: Tag Docker image
      run: |
        docker tag mlops-poc:${{ github.run_number }} \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mlops-poc:sample-${{ github.run_number }}

    - name: Push Docker image
      run: |
        docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mlops-poc:sample-${{ github.run_number }}
    
    - name: Build Flask image
      run: |
        docker build \
          -t mlops-fraud-flask:${{ github.run_number }} \
          ./app

    - name: Tag Flask image
      run: |
        docker tag mlops-fraud-flask:${{ github.run_number }} \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mlops-poc:flask-${{ github.run_number }}
    
    - name: Push Flask image
      run: |
        docker push \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mlops-poc:flask-${{ github.run_number }}

    - name: Deploy Flask App
      run : |
        kubectl set image update deployment/fraud-flask \
          fraud-flask-ui=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/mlops-poc:flask-${{ github.run_number }} \
          -n churn-model